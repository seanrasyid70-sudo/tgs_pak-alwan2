
name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Compile C++ to EXE
        run: |
          x86_64-w64-mingw32-g++ main.cpp -o Menu-Makanan.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Menu-Makanan-EXE
          path: Menu-Makanan.exe
